# GoCast signaling Worker. No account ids or secrets here: `wrangler login`
# picks the account, and secrets are set with `wrangler secret put`.
name = "gocast-signal"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# signal.govrse.app only; cast.govrse.app (join page + app links) is untouched.
routes = [{ pattern = "signal.govrse.app", custom_domain = true }]

[vars]
# Relay kill switch. Anything other than "true" means STUN only.
RELAY_ENABLED = "true"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalRoom"

# SQLite-backed Durable Objects are the ones available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]
